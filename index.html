<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - Physical Education System</title>
    <style>
        :root { --primary: #4285f4; --accent: #34a853; --bg: #f0f2f5; --white: #ffffff; --warn: #fbbc05; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--white); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .p-4 { padding: 20px; }
        .hidden { display: none !important; }
        
        .btn { padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 10px; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }

        .header { background: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; }
        .xp-badge { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; display: inline-block; margin-top: 8px; font-weight: bold; }

        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: 600; color: #777; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: white; }

        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        
        .rpe-container { text-align: center; padding: 10px 0; }
        .rpe-value { color: var(--primary); font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
        .rpe-desc { font-size: 12px; color: #888; margin-top: 5px; display: block; }
        input[type="range"] { padding: 0; cursor: pointer; }

        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }

        .history-list { margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .history-item { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 4px solid var(--primary); font-size: 13px; line-height: 1.4; }
        
        .student-card { background: #fff; border: 1px solid #eee; padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
        .student-card:hover { border-color: var(--primary); background: #f0f7ff; }
        .section-title { border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin: 20px 0 15px 0; color: var(--primary); font-weight: bold; }
        
        .video-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .video-link { color: #856404; font-weight: bold; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth Screen -->
        <div id="auth-screen" class="p-4" style="text-align: center; margin-top: 50px;">
            <h1>Trainer Diary</h1>
            <button class="btn btn-primary" id="login-btn">Увійти через Google</button>
        </div>

        <!-- Registration Screen -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Створення профілю</h2>
            <div class="form-group"><label>Роль</label><select id="reg-role"><option value="student">Студент</option><option value="teacher">Викладач</option></select></div>
            <div class="form-group"><label>Спеціалізація</label><input type="text" id="reg-spec" placeholder="Легка атлетика"></div>
            <div id="reg-group-box" class="form-group"><label>Група</label><input type="text" id="reg-group" placeholder="ФК-21"></div>
            <button class="btn btn-primary" id="save-profile-btn">Почати</button>
        </div>

        <!-- СТУДЕНТСЬКИЙ КАБІНЕТ -->
        <div id="student-dashboard" class="hidden">
            <div class="header">
                <div style="display: flex; justify-content: space-between;">
                    <h2 id="st-name" style="margin:0">Студент</h2>
                    <button id="logout-st" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button>
                </div>
                <div id="st-xp" class="xp-badge">0 XP</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="btn-st-sm">Самоконтроль</button>
                <button class="tab-btn" id="btn-st-mt">Рухові тести</button>
            </div>

            <div id="st-sm-box" class="p-4">
                <div class="form-group"><label>Дата</label><input type="date" id="sm-date"></div>
                <div class="form-group">
                    <label>RPE (Навантаження):</label>
                    <div class="rpe-container">
                        <span id="rpe-num" class="rpe-value">5</span>
                        <input type="range" id="sm-rpe" min="1" max="10" value="5">
                        <span id="rpe-text" class="rpe-desc">Помірне навантаження</span>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group"><label>Втома (1-5)</label><select id="sm-fatigue"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                    <div class="form-group"><label>Сон (1-5)</label><select id="sm-sleep"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                </div>
                <div class="form-group"><label>Біль у м'язах (1-5)</label><select id="sm-muscle"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
                <div class="form-group"><label>Нотатки</label><textarea id="sm-notes" rows="2" placeholder="Ваші відчуття"></textarea></div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>
                <div class="history-list"><h4>Історія самоконтролю</h4><div id="sm-history"></div></div>
            </div>

            <div id="st-mt-box" class="hidden p-4">
                <div class="video-box">
                    <a href="https://drive.google.com/drive/folders/13wjY8OT-6ycHIVc0pxFy1XpXmrwVhD8e?usp=sharing" target="_blank" class="video-link">
                        📁 Завантажити відео виконаного тесту
                    </a>
                </div>
                <div class="form-group"><label>Назва нормативу</label>
                    <select id="mt-type">
                        <option>Біг на 30 метрів з високого старту</option>
                        <option>12-хвилинний біговий тест Купера</option>
                        <option>Піднімання тулуба в сід за 1 хвилину</option>
                        <option>Вертикальний стрибок (Тест Сарджента)</option>
                        <option>Згинання та розгинання рук (Віджимання)</option>
                        <option>Стрибок у довжину з місця</option>
                        <option>Нахил тулуба вперед із положення сидячи</option>
                        <option>Тест Бурпі</option>
                        <option>Тест статокінетичної стійкості «Фламінго»</option>
                    </select>
                </div>
                <div class="row">
                    <div class="form-group"><label>Результат</label><input type="number" id="mt-val" step="0.01"></div>
                    <div class="form-group"><label>Одиниця</label><select id="mt-unit"><option>сек</option><option>м</option><option>разів</option><option>см</option></select></div>
                </div>
                <button class="btn btn-primary" id="save-mt-btn" style="background:var(--accent)">Зафіксувати результат (+10 XP)</button>
                <div class="history-list"><h4>Історія нормативів</h4><div id="mt-history"></div></div>
            </div>
        </div>

        <!-- ПАНЕЛЬ ВИКЛАДАЧА -->
        <div id="teacher-dashboard" class="hidden">
            <div class="header">
                <div style="display: flex; justify-content: space-between;">
                    <h2 id="th-name" style="margin:0">Викладач</h2>
                    <button id="logout-th" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button>
                </div>
            </div>

            <div class="p-4">
                <div class="form-group"><label>Група</label><select id="th-group-filter"></select></div>
                <div id="student-list"></div>

                <div id="th-details" class="hidden" style="margin-top: 20px;">
                    <div class="section-title" id="th-student-title">Студент</div>
                    <div class="tabs">
                        <button class="tab-btn active" id="th-btn-stat">Моніторинг</button>
                        <button class="tab-btn" id="th-btn-action">Дії</button>
                    </div>

                    <div id="th-stat-box" class="p-4">
                        <h4>Самоконтроль (Розширені дані)</h4><div id="th-sm-history"></div>
                        <h4>Рухові тести</h4><div id="th-mt-history"></div>
                    </div>

                    <div id="th-action-box" class="p-4 hidden">
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
                            <label>Бал</label><input type="number" id="th-grade-val">
                            <button class="btn btn-primary" id="th-save-grade">Зберегти оцінку</button>
                        </div>
                        <button class="btn btn-accent" id="th-award-badge">Вручити нагороду (+50 XP)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const rpeTexts = ["-", "Дуже легко", "Легко", "Помірно", "Досить легко", "Важко", "Важче", "Дуже важко", "Дуже-дуже важко", "Майже макс", "Максимум"];
        let selStudentId = null;

        document.getElementById('sm-rpe').oninput = function() {
            document.getElementById('rpe-num').innerText = this.value;
            document.getElementById('rpe-text').innerText = rpeTexts[this.value];
        };
        document.getElementById('sm-date').valueAsDate = new Date();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                if (userDoc.exists()) {
                    const d = userDoc.data();
                    d.role === 'teacher' ? (showScreen('teacher-dashboard'), initTeacher(d)) : (showScreen('student-dashboard'), initStudent(user, d));
                } else { showScreen('profile-form-screen'); }
            } else { showScreen('auth-screen'); }
        });

        function initStudent(user, data) {
            document.getElementById('st-name').innerText = data.full_name;
            onSnapshot(doc(db, "Users", user.uid), (snap) => {
                if (snap.exists()) document.getElementById('st-xp').innerText = (snap.data().total_xp || 0) + " XP";
            });
            loadHistory(user.uid, 'sm-history', 'Self_Monitoring');
            loadHistory(user.uid, 'mt-history', 'Motor_Tests');
        }

        async function loadHistory(uid, containerId, collName) {
            const q = query(collection(db, collName), where("user_id", "==", uid), orderBy("created_at", "desc"), limit(10));
            onSnapshot(q, (snap) => {
                document.getElementById(containerId).innerHTML = snap.docs.map(d => {
                    const dt = d.data();
                    if(collName === 'Self_Monitoring') {
                        return `<div class="history-item">📅 <b>${dt.entry_date}</b><br>RPE: ${dt.rpe_score} | Втома: ${dt.fatigue_level}/5 | Сон: ${dt.sleep_quality}/5 | Біль: ${dt.muscle_soreness}/5</div>`;
                    } else {
                        return `<div class="history-item">🏆 <b>${dt.test_type}</b><br>Результат: ${dt.test_value} ${dt.measurement_unit}</div>`;
                    }
                }).join('');
            });
        }

        document.getElementById('save-sm-btn').onclick = async () => {
            const user = auth.currentUser;
            const dateStr = document.getElementById('sm-date').value;
            const snap = await getDocs(query(collection(db, "Self_Monitoring"), where("user_id", "==", user.uid), where("entry_date", "==", dateStr)));
            if (!snap.empty) return alert("Дані за цю дату вже внесено!");

            await addDoc(collection(db, "Self_Monitoring"), {
                user_id: user.uid, entry_date: dateStr,
                rpe_score: parseInt(document.getElementById('sm-rpe').value),
                fatigue_level: parseInt(document.getElementById('sm-fatigue').value),
                sleep_quality: parseInt(document.getElementById('sm-sleep').value),
                muscle_soreness: parseInt(document.getElementById('sm-muscle').value),
                health_notes: document.getElementById('sm-notes').value,
                created_at: serverTimestamp()
            });
            await setDoc(doc(db, "Users", user.uid), { total_xp: increment(10) }, { merge: true });
            alert("Дані самоконтролю збережено! +10 XP");
        };

        document.getElementById('save-mt-btn').onclick = async () => {
            const user = auth.currentUser;
            const type = document.getElementById('mt-type').value;
            await addDoc(collection(db, "Motor_Tests"), {
                user_id: user.uid, test_type: type,
                test_value: parseFloat(document.getElementById('mt-val').value),
                measurement_unit: document.getElementById('mt-unit').value,
                created_at: serverTimestamp(), entry_date: new Date().toISOString().split('T')[0]
            });
            await setDoc(doc(db, "Users", user.uid), { total_xp: increment(10) }, { merge: true });
            alert("Норматив зафіксовано! +10 XP");
        };

        async function initTeacher(data) {
            document.getElementById('th-name').innerText = data.full_name;
            const snap = await getDocs(query(collection(db, "Users"), where("role", "==", "student")));
            const students = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const groups = [...new Set(students.map(s => s.group_id))];
            const filter = document.getElementById('th-group-filter');
            filter.innerHTML = '<option value="">Група</option>' + groups.map(g => `<option value="${g}">${g}</option>`).join('');
            
            filter.onchange = () => {
                const filtered = students.filter(s => s.group_id === filter.value);
                document.getElementById('student-list').innerHTML = filtered.map(s => `
                    <div class="student-card" onclick="openStudent('${s.id}', '${s.full_name}')">
                        <b>${s.full_name}</b><br><small>${s.total_xp} XP | ${s.sport_specialization}</small>
                    </div>
                `).join('');
            };
        }

        window.openStudent = (id, name) => {
            selStudentId = id;
            document.getElementById('th-details').classList.remove('hidden');
            document.getElementById('th-student-title').innerText = name;
            loadHistory(id, 'th-sm-history', 'Self_Monitoring');
            loadHistory(id, 'th-mt-history', 'Motor_Tests');
        };

        document.getElementById('th-save-grade').onclick = async () => {
            if(!selStudentId) return;
            await addDoc(collection(db, "Grades"), { user_id: selStudentId, teacher_id: auth.currentUser.uid, grade_value: parseInt(document.getElementById('th-grade-val').value), graded_at: serverTimestamp() });
            alert("Оцінку збережено!");
        };

        document.getElementById('th-award-badge').onclick = async () => {
            if(!selStudentId) return;
            await setDoc(doc(db, "Users", selStudentId), { total_xp: increment(50) }, { merge: true });
            alert("Вручено нагороду! +50 XP студенту");
        };

        function showScreen(id) { document.querySelectorAll('.container > div').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-st').onclick = () => signOut(auth);
        document.getElementById('logout-th').onclick = () => signOut(auth);
        
        document.getElementById('btn-st-sm').onclick = () => { document.getElementById('st-sm-box').classList.remove('hidden'); document.getElementById('st-mt-box').classList.add('hidden'); document.getElementById('btn-st-sm').classList.add('active'); document.getElementById('btn-st-mt').classList.remove('active'); };
        document.getElementById('btn-st-mt').onclick = () => { document.getElementById('st-sm-box').classList.add('hidden'); document.getElementById('st-mt-box').classList.remove('hidden'); document.getElementById('btn-st-sm').classList.remove('active'); document.getElementById('btn-st-mt').classList.add('active'); };
        document.getElementById('th-btn-stat').onclick = () => { document.getElementById('th-stat-box').classList.remove('hidden'); document.getElementById('th-action-box').classList.add('hidden'); document.getElementById('th-btn-stat').classList.add('active'); document.getElementById('th-btn-action').classList.remove('active'); };
        document.getElementById('th-btn-action').onclick = () => { document.getElementById('th-stat-box').classList.add('hidden'); document.getElementById('th-action-box').classList.remove('hidden'); document.getElementById('th-btn-stat').classList.remove('active'); document.getElementById('th-btn-action').classList.add('active'); };

        document.getElementById('save-profile-btn').onclick = async () => {
            const u = auth.currentUser;
            const r = document.getElementById('reg-role').value;
            await setDoc(doc(db, "Users", u.uid), { user_id: u.uid, full_name: u.displayName, email: u.email, role: r, sport_specialization: document.getElementById('reg-spec').value, group_id: r === 'student' ? document.getElementById('reg-group').value : "Teacher", total_xp: 0, created_at: serverTimestamp() });
        };
    </script>
</body>
</html>
