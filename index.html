<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - Academic v4.0</title>
    <style>
        :root { --primary: #4285f4; --accent: #34a853; --bg: #f0f2f5; --white: #ffffff; --warn: #fbbc05; --danger: #ea4335; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--white); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .p-4 { padding: 20px; }
        .hidden { display: none !important; }
        
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; margin-top: 5px; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; }
        .xp-badge { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; display: inline-block; margin-top: 8px; font-weight: bold; }

        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: 600; color: #777; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: white; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .history-item { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--primary); font-size: 13px; }
        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .badge-card { text-align: center; padding: 10px; border-radius: 10px; opacity: 0.3; grayscale: 1; border: 1px solid #ddd; font-size: 10px; }
        .badge-card.earned { opacity: 1; grayscale: 0; border-color: var(--warn); background: #fffde7; }
        
        .leaderboard { width: 100%; border-collapse: collapse; font-size: 14px; }
        .leaderboard td { padding: 10px; border-bottom: 1px solid #eee; }
        .me { background: #e3f2fd; font-weight: bold; }

        .drive-box { background: #e8f0fe; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth Screen -->
        <div id="auth-screen" class="p-4" style="text-align: center; margin-top: 50px;">
            <h1>Trainer Diary</h1>
            <button class="btn btn-primary" id="login-btn">Увійти через Google</button>
        </div>

        <!-- Registration -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Створення профілю</h2>
            <div class="form-group"><label>Роль</label><select id="reg-role"><option value="student">Студент</option><option value="teacher">Викладач</option></select></div>
            <div class="form-group"><label>Спеціалізація</label><input type="text" id="reg-spec" placeholder="Напр. Футбол"></div>
            <div class="form-group"><label>Група</label><input type="text" id="reg-group" placeholder="Напр. ФК-21"></div>
            <button class="btn btn-primary" id="save-profile-btn">Створити профіль</button>
        </div>

        <!-- СТУДЕНТ -->
        <div id="student-dashboard" class="hidden">
            <div class="header">
                <div style="display: flex; justify-content: space-between;">
                    <h2 id="st-name" style="margin:0">Студент</h2>
                    <button id="logout-st" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button>
                </div>
                <div id="st-xp" class="xp-badge">0 XP</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="st-sm">Форми</button>
                <button class="tab-btn" data-tab="st-tasks">Завдання</button>
                <button class="tab-btn" data-tab="st-rank">Рейтинг</button>
            </div>

            <div id="st-sm" class="tab-content p-4">
                <div class="form-group"><label>Дата самоконтролю (1 раз на добу)</label><input type="date" id="sm-date"></div>
                <div class="form-group"><label>RPE: <span id="rpe-num">5</span></label><input type="range" id="sm-rpe" min="1" max="10"></div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>
                
                <hr style="margin:20px 0">
                
                <div class="drive-box">
                    <a href="https://drive.google.com/drive/folders/13wjY8OT-6ycHIVc0pxFy1XpXmrwVhD8e?usp=sharing" target="_blank" style="text-decoration:none; color:var(--primary); font-weight:bold;">📁 Google Диск для відео тесту</a>
                </div>
                <div class="form-group">
                    <label>Руховий тест (Макс. 3 спроби на кожен тип)</label>
                    <select id="mt-type">
                        <option>Біг на 30 метрів з високого старту</option>
                        <option>12-хвилинний біговий тест Купера</option>
                        <option>Піднімання тулуба в сід за 1 хвилину</option>
                        <option>Вертикальний стрибок (Тест Сарджента)</option>
                        <option>Згинання та розгинання рук (Віджимання)</option>
                        <option>Стрибок у довжину з місця</option>
                        <option>Нахил тулуба вперед із положення сидячи</option>
                        <option>Тест Бурпі</option>
                        <option>Тест статокінетичної стійкості «Фламінго»</option>
                    </select>
                </div>
                <input type="number" id="mt-val" placeholder="Ваш результат" class="form-group">
                <button class="btn btn-accent" id="save-mt-btn">Зафіксувати результат (+10 XP)</button>
                <div id="mt-attempts-info" style="font-size:11px; color:#666; margin-top:5px"></div>
            </div>

            <div id="st-tasks" class="tab-content hidden p-4">
                <h3>Індивідуальні завдання</h3>
                <div id="task-list"></div>
                <div id="task-submit-box" class="hidden" style="background:#f9f9f9; padding:15px; border-radius:10px; margin-top:15px">
                    <h4 id="active-task-title"></h4>
                    <div class="form-group">
                        <label>Звіт про виконання (текст)</label>
                        <textarea id="task-comment" placeholder="Опишіть виконану роботу..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Посилання на Google Диск / Конспект</label>
                        <input type="url" id="task-url" placeholder="https://drive.google.com/...">
                    </div>
                    <button class="btn btn-accent" id="submit-task-btn">Надіслати викладачу</button>
                </div>
            </div>

            <div id="st-rank" class="tab-content hidden p-4">
                <h4>Лідерборд групи</h4>
                <table class="leaderboard"><tbody id="leaderboard-body"></tbody></table>
                <h4 style="margin-top:20px">Досягнення</h4>
                <div id="badge-container" class="badge-grid"></div>
            </div>
        </div>

        <!-- ВИКЛАДАЧ -->
        <div id="teacher-dashboard" class="hidden">
            <div class="header">
                <h2>Панель викладача</h2>
                <button id="logout-th" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button>
            </div>
            <div class="p-4">
                <select id="th-group-filter" class="form-group"></select>
                <div id="th-student-list"></div>

                <div id="th-details" class="hidden" style="margin-top:20px; padding:15px; border:1px solid #ddd; border-radius:10px">
                    <h3 id="th-student-name"></h3>
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="th-res">Результати</button>
                        <button class="tab-btn" data-tab="th-actions">Дії</button>
                    </div>
                    <div id="th-res" class="tab-content p-4">
                        <h4>Самоконтроль</h4><div id="th-sm-list"></div>
                        <h4>Тести</h4><div id="th-mt-list"></div>
                    </div>
                    <div id="th-actions" class="tab-content hidden p-4">
                        <label>Нагородити значком (+50 XP)</label>
                        <button class="btn btn-accent" id="th-award-btn">Вручити "Тренер року"</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Global variables
        let currentUid = null;
        let selStudentId = null; 
        let activeTaskId = null;
        let myGroup = null;

        // UI Handlers
        document.getElementById('sm-date').valueAsDate = new Date();
        document.getElementById('sm-rpe').oninput = function() { document.getElementById('rpe-num').innerText = this.value; };

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                const parent = btn.parentElement;
                parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const container = parent.parentElement;
                container.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.tab).classList.remove('hidden');
            };
        });

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUid = user.uid;
                const snap = await getDoc(doc(db, "Users", user.uid));
                if (snap.exists()) {
                    const d = snap.data(); myGroup = d.group_id;
                    d.role === 'teacher' ? (showScreen('teacher-dashboard'), initTeacher()) : (showScreen('student-dashboard'), initStudent(d));
                } else { showScreen('profile-form-screen'); }
            } else { showScreen('auth-screen'); }
        });

        // --- STUDENT ---
        function initStudent(data) {
            document.getElementById('st-name').innerText = data.full_name;
            onSnapshot(doc(db, "Users", currentUid), s => { if(s.exists()) document.getElementById('st-xp').innerText = (s.data().total_xp || 0) + " XP"; });
            
            // Leaderboard
            onSnapshot(query(collection(db, "Users"), where("group_id", "==", myGroup), orderBy("total_xp", "desc")), s => {
                document.getElementById('leaderboard-body').innerHTML = s.docs.map((d, i) => `
                    <tr class="${d.id === currentUid ? 'me' : ''}"><td>${i+1}</td><td>${d.data().full_name}</td><td>${d.data().total_xp} XP</td></tr>
                `).join('');
            });

            // Tasks
            onSnapshot(query(collection(db, "Individual_Tasks"), where("user_id", "==", currentUid)), s => {
                document.getElementById('task-list').innerHTML = s.docs.map(d => `
                    <div class="history-item" onclick="openTask('${d.id}', '${d.data().task_title}')">
                        ${d.data().task_title} [${d.data().is_completed ? 'Здано' : 'Очікує'}]
                    </div>
                `).join('') || "Завдань не призначено";
            });
        }

        window.openTask = (id, title) => {
            activeTaskId = id;
            document.getElementById('task-submit-box').classList.remove('hidden');
            document.getElementById('active-task-title').innerText = "Здача: " + title;
        };

        // Save SM
        document.getElementById('save-sm-btn').onclick = async () => {
            const dateStr = document.getElementById('sm-date').value;
            const docId = `${currentUid}_${dateStr}`;
            try {
                const snap = await getDoc(doc(db, "Self_Monitoring", docId));
                if (snap.exists()) return alert("Сьогодні дані вже внесено!");
                await setDoc(doc(db, "Self_Monitoring", docId), {
                    user_id: currentUid, entry_date: dateStr, created_at: serverTimestamp(),
                    rpe_score: parseInt(document.getElementById('sm-rpe').value)
                });
                await updateDoc(doc(db, "Users", currentUid), { total_xp: increment(10) });
                alert("Збережено!");
            } catch (e) { alert("Помилка запису."); }
        };

        // Save MT (Limit 3 attempts per test type)
        document.getElementById('save-mt-btn').onclick = async () => {
            const type = document.getElementById('mt-type').value;
            const q = query(collection(db, "Motor_Tests"), where("user_id", "==", currentUid), where("test_type", "==", type));
            const existing = await getDocs(q);
            
            if (existing.size >= 3) return alert("Ви використали всі 3 спроби для цього тесту!");

            const attemptNum = existing.size + 1;
            const docId = `${currentUid}_${type.replace(/\s/g, '')}_${attemptNum}`;
            
            await setDoc(doc(db, "Motor_Tests", docId), {
                user_id: currentUid, test_type: type, attempt: attemptNum,
                test_value: parseFloat(document.getElementById('mt-val').value),
                created_at: serverTimestamp()
            });
            await updateDoc(doc(db, "Users", currentUid), { total_xp: increment(10) });
            alert(`Спроба №${attemptNum} збережена!`);
        };

        document.getElementById('submit-task-btn').onclick = async () => {
            if(!activeTaskId) return;
            await updateDoc(doc(db, "Individual_Tasks", activeTaskId), {
                is_completed: true, submitted_at: serverTimestamp(),
                submission_content: document.getElementById('task-comment').value,
                attachment_url: document.getElementById('task-url').value
            });
            alert("Завдання надіслано!"); document.getElementById('task-submit-box').classList.add('hidden');
        };

        // --- TEACHER ---
        async function initTeacher() {
            const snap = await getDocs(query(collection(db, "Users"), where("role", "==", "student")));
            const students = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const groups = [...new Set(students.map(s => s.group_id))];
            
            const filter = document.getElementById('th-group-filter');
            filter.innerHTML = '<option value="">Оберіть групу</option>' + groups.map(g => `<option value="${g}">${g}</option>`).join('');
            
            filter.onchange = (e) => {
                const list = students.filter(s => s.group_id === e.target.value);
                document.getElementById('th-student-list').innerHTML = list.map(s => `
                    <div class="history-item" onclick="openThStudent('${s.id}', '${s.full_name}')">
                        ${s.full_name} (${s.total_xp} XP)
                    </div>
                `).join('');
            };
        }

        // Global function for onclick
        window.openThStudent = (id, name) => {
            selStudentId = id; // Set global variable
            document.getElementById('th-details').classList.remove('hidden');
            document.getElementById('th-student-name').innerText = name;
            
            // Listeners for selected student
            onSnapshot(query(collection(db, "Self_Monitoring"), where("user_id", "==", id), orderBy("created_at", "desc"), limit(5)), s => {
                document.getElementById('th-sm-list').innerHTML = s.docs.map(d => `<div class="history-item">${d.data().entry_date}: RPE ${d.data().rpe_score}</div>`).join('') || "Немає даних";
            });
            onSnapshot(query(collection(db, "Motor_Tests"), where("user_id", "==", id), orderBy("created_at", "desc")), s => {
                document.getElementById('th-mt-list').innerHTML = s.docs.map(d => `<div class="history-item">${d.data().test_type}: ${d.data().test_value}</div>`).join('') || "Немає тестів";
            });
        };

        document.getElementById('th-award-btn').onclick = async () => {
            if (!selStudentId) return alert("Оберіть студента");
            await updateDoc(doc(db, "Users", selStudentId), { total_xp: increment(50) });
            alert("Нагороджено +50 XP");
        };

        // Helpers
        function showScreen(id) { document.querySelectorAll('.container > div').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-st').onclick = () => signOut(auth);
        document.getElementById('logout-th').onclick = () => signOut(auth);
        document.getElementById('save-profile-btn').onclick = async () => {
            const r = document.getElementById('reg-role').value;
            await setDoc(doc(db, "Users", currentUid), {
                user_id: currentUid, full_name: auth.currentUser.displayName, email: auth.currentUser.email,
                role: r, sport_specialization: document.getElementById('reg-spec').value,
                group_id: r === 'student' ? document.getElementById('reg-group').value : "Teacher",
                total_xp: 0, created_at: serverTimestamp()
            });
        };
    </script>
</body>
</html>
