<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - Final Academic System</title>
    <style>
        :root { --primary: #4285f4; --accent: #34a853; --bg: #f0f2f5; --white: #ffffff; --warn: #fbbc05; --danger: #ea4335; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: var(--white); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .p-4 { padding: 20px; }
        .hidden { display: none !important; }
        
        /* UI Elements */
        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; margin-top: 5px; width: 100%; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .header { background: var(--primary); color: white; padding: 20px; border-radius: 0 0 20px 20px; }
        .xp-badge { background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; display: inline-block; margin-top: 8px; font-weight: bold; }

        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #ddd; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 100px; padding: 15px; border: none; background: none; cursor: pointer; font-weight: 600; color: #777; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: white; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        
        .rpe-box { text-align: center; padding: 10px; background: #fcfcfc; border-radius: 8px; border: 1px solid #eee; }
        .rpe-val { font-size: 18px; font-weight: bold; color: var(--primary); }

        .history-item { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--primary); font-size: 13px; line-height: 1.5; }
        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 15px; }
        .badge-card { text-align: center; padding: 10px; border-radius: 10px; background: #f9f9f9; opacity: 0.3; filter: grayscale(1); border: 1px solid #ddd; font-size: 10px; }
        .badge-card.earned { opacity: 1; filter: grayscale(0); border-color: var(--warn); background: #fffde7; }
        
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        .leaderboard-table td, th { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .me { background: #e3f2fd; font-weight: bold; }

        .drive-box { background: #e8f0fe; padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: center; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth Screen -->
        <div id="auth-screen" class="p-4" style="text-align: center; margin-top: 50px;">
            <h1>Trainer Diary</h1>
            <p>Система моніторингу та гейміфікації</p>
            <button class="btn btn-primary" id="login-btn">Увійти через Google</button>
        </div>

        <!-- Registration -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Створення профілю</h2>
            <div class="form-group"><label>Роль</label><select id="reg-role"><option value="student">Студент</option><option value="teacher">Викладач</option></select></div>
            <div class="form-group"><label>Спеціалізація</label><input type="text" id="reg-spec" placeholder="Легка атлетика"></div>
            <div id="reg-group-box" class="form-group"><label>Група</label><input type="text" id="reg-group" placeholder="ФК-21"></div>
            <button class="btn btn-primary" id="save-profile-btn">Завершити реєстрацію</button>
        </div>

        <!-- СТУДЕНТ -->
        <div id="student-dashboard" class="hidden">
            <div class="header">
                <div style="display: flex; justify-content: space-between;">
                    <h2 id="st-name" style="margin:0">Студент</h2>
                    <button id="logout-st" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button>
                </div>
                <div id="st-xp" class="xp-badge">0 XP</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="st-sm">Форми</button>
                <button class="tab-btn" data-tab="st-tasks">Завдання</button>
                <button class="tab-btn" data-tab="st-rank">Рейтинг</button>
            </div>

            <div id="st-sm" class="tab-content p-4">
                <div class="form-group">
                    <label>Дата запису (1 раз на добу)</label>
                    <input type="date" id="sm-date">
                </div>
                <div class="form-group">
                    <label>RPE (Навантаження): <span id="rpe-num" class="rpe-val">5</span></label>
                    <input type="range" id="sm-rpe" min="1" max="10" value="5">
                </div>
                <div style="display:flex; gap:10px">
                    <div class="form-group" style="flex:1"><label>Втома</label><select id="sm-fatigue"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                    <div class="form-group" style="flex:1"><label>Сон</label><select id="sm-sleep"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                </div>
                <div class="form-group"><label>М'язовий біль</label><select id="sm-muscle"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>
                
                <hr style="margin: 20px 0">
                
                <div class="drive-box">
                    <a href="https://drive.google.com/drive/folders/13wjY8OT-6ycHIVc0pxFy1XpXmrwVhD8e?usp=sharing" target="_blank" style="text-decoration:none; font-weight:bold; color:var(--primary)">📁 Google Диск для відео тестів</a>
                </div>
                <div class="form-group"><label>Руховий тест (1 раз на місяць)</label>
                    <select id="mt-type">
                        <option>Біг на 30 метрів з високого старту</option>
                        <option>12-хвилинний біговий тест Купера</option>
                        <option>Піднімання тулуба в сід за 1 хвилину</option>
                        <option>Вертикальний стрибок (Тест Сарджента)</option>
                        <option>Згинання та розгинання рук (Віджимання)</option>
                        <option>Стрибок у довжину з місця</option>
                        <option>Нахил тулуба вперед із положення сидячи</option>
                        <option>Тест Бурпі</option>
                        <option>Тест статокінетичної стійкості «Фламінго»</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px">
                    <input type="number" id="mt-val" placeholder="Результат" style="flex:2">
                    <select id="mt-unit" style="flex:1"><option>сек</option><option>м</option><option>разів</option><option>см</option></select>
                </div>
                <button class="btn btn-accent" id="save-mt-btn">Зберегти тест (+10 XP)</button>
            </div>

            <div id="st-tasks" class="tab-content hidden p-4">
                <div id="task-list"></div>
                <div id="task-submit-box" class="hidden review-card" style="background:#f9f9f9; padding:15px; border-radius:10px; border:1px solid #ddd">
                    <h4 id="active-task-title"></h4>
                    <textarea id="task-comment" placeholder="Коментар..."></textarea>
                    <input type="url" id="task-url" placeholder="Посилання на конспект" style="margin-top:10px">
                    <button class="btn btn-accent" id="submit-task-btn">Здати завдання</button>
                </div>
            </div>

            <div id="st-rank" class="tab-content hidden p-4">
                <h4>🏆 Лідерборд групи <span id="st-group-id"></span></h4>
                <table class="leaderboard-table"><tbody id="leaderboard-body"></tbody></table>
                <h4 style="margin-top:20px">🏅 Досягнення</h4>
                <div id="badge-container" class="badge-grid"></div>
            </div>
        </div>

        <!-- ВИКЛАДАЧ -->
        <div id="teacher-dashboard" class="hidden">
            <div class="header"><h2>Викладач</h2><button id="logout-th" style="background:none; border:none; color:white; cursor:pointer;">Вийти</button></div>
            <div class="p-4">
                <select id="th-group-filter" class="form-group"></select>
                <div id="th-student-list"></div>
                <div id="th-details" class="hidden" style="margin-top:20px; border:1px solid #ddd; padding:15px; border-radius:10px">
                    <h3 id="th-student-name"></h3>
                    <div id="th-sm-history"></div>
                    <div id="th-mt-history"></div>
                    <hr>
                    <label>Нагородити значком (+50 XP)</label>
                    <select id="th-badge-id"><option value="trainer">Тренер</option><option value="iot_expert">Фахівець IoT</option></select>
                    <button class="btn btn-accent" id="th-award-btn">Вручити нагороду</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const BADGES = {
            turbo: { title: "Турбо", xp: 30, icon: "⚡" },
            trainer: { title: "Тренер", xp: 50, icon: "📋" },
            iot_expert: { title: "Фахівець", xp: 40, icon: "⌚" },
            strategist: { title: "Стратег", xp: 35, icon: "🎯" },
            ai_mind: { title: "Штучка-інтелект", xp: 35, icon: "🤖" }
        };

        let currentUid, myGroup, activeTaskId, activeTaskData;

        // UI
        document.getElementById('sm-date').valueAsDate = new Date();
        document.getElementById('sm-rpe').oninput = function() { document.getElementById('rpe-num').innerText = this.value; };

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                const parent = btn.parentElement;
                parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(btn.dataset.tab).classList.remove('hidden');
            };
        });

        // Auth
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUid = user.uid;
                const snap = await getDoc(doc(db, "Users", user.uid));
                if (snap.exists()) {
                    const d = snap.data(); myGroup = d.group_id;
                    d.role === 'teacher' ? (showScreen('teacher-dashboard'), initTeacher()) : (showScreen('student-dashboard'), initStudent(d));
                } else { showScreen('profile-form-screen'); }
            } else { showScreen('auth-screen'); }
        });

        // --- ГЕЙМІФІКАЦІЯ ---
        async function awardBadge(uid, badgeId, reason = "Автоматична нагорода") {
            const badgeKey = `${uid}_${badgeId}`;
            const check = await getDoc(doc(db, "User_Badges", badgeKey));
            if (!check.exists()) {
                await setDoc(doc(db, "User_Badges", badgeKey), {
                    user_id: uid, badge_id: badgeId, reason_or_comment: reason, awarded_at: serverTimestamp()
                });
                await updateDoc(doc(db, "Users", uid), { total_xp: increment(BADGES[badgeId].xp) });
                if (uid === currentUid) alert(`🎉 Відзнака отримана: ${BADGES[badgeId].title}!`);
            }
        }

        async function checkTurbo() {
            const today = new Date().toISOString().split('T')[0];
            const q1 = query(collection(db, "Self_Monitoring"), where("user_id", "==", currentUid), where("entry_date", "==", today));
            const q2 = query(collection(db, "Motor_Tests"), where("user_id", "==", currentUid), where("created_at", ">=", new Date(today)));
            const [s1, s2] = await Promise.all([getDocs(q1), getDocs(q2)]);
            if ((s1.size + s2.size) >= 3) await awardBadge(currentUid, 'turbo', '3+ активності за день');
        }

        // --- СТУДЕНТ ---
        function initStudent(data) {
            document.getElementById('st-name').innerText = data.full_name;
            document.getElementById('st-group-id').innerText = data.group_id;
            onSnapshot(doc(db, "Users", currentUid), s => { if(s.exists()) document.getElementById('st-xp').innerText = (s.data().total_xp || 0) + " XP"; });
            
            // Leaderboard
            onSnapshot(query(collection(db, "Users"), where("group_id", "==", myGroup), orderBy("total_xp", "desc")), s => {
                document.getElementById('leaderboard-body').innerHTML = s.docs.map((d, i) => `
                    <tr class="${d.id === currentUid ? 'me' : ''}"><td>${i+1}</td><td>${d.data().full_name}</td><td>${d.data().sport_specialization}</td><td>${d.data().total_xp}</td></tr>
                `).join('');
            });

            // Badges
            onSnapshot(query(collection(db, "User_Badges"), where("user_id", "==", currentUid)), s => {
                const earned = s.docs.map(d => d.data().badge_id);
                document.getElementById('badge-container').innerHTML = Object.keys(BADGES).map(id => `
                    <div class="badge-card ${earned.includes(id) ? 'earned' : ''}"><i>${BADGES[id].icon}</i><br>${BADGES[id].title}</div>
                `).join('');
            });

            // Tasks
            onSnapshot(query(collection(db, "Individual_Tasks"), where("user_id", "==", currentUid)), s => {
                document.getElementById('task-list').innerHTML = s.docs.map(d => `
                    <div class="history-item" onclick="openTask('${d.id}', '${d.data().task_title}', '${d.data().task_category}', '${d.data().deadline_at}')">
                        ${d.data().task_title} [${d.data().is_completed ? 'Здано' : 'Очікує'}]
                    </div>
                `).join('');
            });
        }

        window.openTask = (id, title, cat, dead) => {
            activeTaskId = id; activeTaskData = { cat, dead };
            document.getElementById('task-submit-box').classList.remove('hidden');
            document.getElementById('active-task-title').innerText = title;
        };

        // SAVE SM (1 PER DAY)
        document.getElementById('save-sm-btn').onclick = async () => {
            const dateStr = document.getElementById('sm-date').value;
            const docId = `${currentUid}_${dateStr}`;
            try {
                const snap = await getDoc(doc(db, "Self_Monitoring", docId));
                if (snap.exists()) return alert("Сьогодні дані вже внесено!");
                
                await setDoc(doc(db, "Self_Monitoring", docId), {
                    user_id: currentUid, entry_date: dateStr, created_at: serverTimestamp(),
                    rpe_score: parseInt(document.getElementById('sm-rpe').value),
                    fatigue_level: parseInt(document.getElementById('sm-fatigue').value),
                    sleep_quality: parseInt(document.getElementById('sm-sleep').value),
                    muscle_soreness: parseInt(document.getElementById('sm-muscle').value)
                });
                await updateDoc(doc(db, "Users", currentUid), { total_xp: increment(10) });
                await checkTurbo(); alert("Збережено!");
            } catch (e) { alert("Помилка: Ви вже звітували сьогодні."); }
        };

        // SAVE MT (1 PER MONTH)
        document.getElementById('save-mt-btn').onclick = async () => {
            const type = document.getElementById('mt-type').value;
            const month = new Date().toISOString().slice(0, 7);
            const docId = `${currentUid}_${type.replace(/\s/g, '')}_${month}`;
            
            try {
                const snap = await getDoc(doc(db, "Motor_Tests", docId));
                if (snap.exists()) return alert("Цей тест уже здано в цьому місяці!");

                await setDoc(doc(db, "Motor_Tests", docId), {
                    user_id: currentUid, test_type: type, month_id: month, created_at: serverTimestamp(),
                    test_value: parseFloat(document.getElementById('mt-val').value),
                    measurement_unit: document.getElementById('mt-unit').value
                });
                await updateDoc(doc(db, "Users", currentUid), { total_xp: increment(10) });
                await checkTurbo(); alert("Результат зафіксовано!");
            } catch (e) { alert("Цей тест уже здано у поточному місяці."); }
        };

        document.getElementById('submit-task-btn').onclick = async () => {
            if(!activeTaskId) return;
            const now = new Date();
            await updateDoc(doc(db, "Individual_Tasks", activeTaskId), {
                is_completed: true, submitted_at: serverTimestamp(),
                submission_content: document.getElementById('task-comment').value,
                attachment_url: document.getElementById('task-url').value
            });
            if (activeTaskData.cat === 'IoT') await awardBadge(currentUid, 'iot_expert');
            if (activeTaskData.dead && now < new Date(activeTaskData.dead)) await awardBadge(currentUid, 'strategist');
            alert("Завдання здано!"); document.getElementById('task-submit-box').classList.add('hidden');
        };

        // --- ВИКЛАДАЧ ---
        async function initTeacher() {
            const snap = await getDocs(query(collection(db, "Users"), where("role", "==", "student")));
            const students = snap.docs.map(d => ({id: d.id, ...d.data()}));
            const groups = [...new Set(students.map(s => s.group_id))];
            const filter = document.getElementById('th-group-filter');
            filter.innerHTML = '<option value="">Група...</option>' + groups.map(g => `<option value="${g}">${g}</option>`).join('');
            filter.onchange = () => {
                document.getElementById('th-student-list').innerHTML = students.filter(s => s.group_id === filter.value).map(s => `
                    <div class="history-item" onclick="openThStudent('${s.id}', '${s.full_name}')">${s.full_name}</div>
                `).join('');
            };
        }

        window.openThStudent = (id, name) => {
            selStudentId = id; document.getElementById('th-details').classList.remove('hidden');
            document.getElementById('th-student-name').innerText = name;
            onSnapshot(query(collection(db, "Self_Monitoring"), where("user_id", "==", id), orderBy("created_at", "desc"), limit(3)), s => {
                document.getElementById('th-sm-history').innerHTML = '<b>Самоконтроль:</b>' + s.docs.map(d => `<br>${d.data().entry_date}: RPE ${d.data().rpe_score}`).join('');
            });
        };

        document.getElementById('th-award-btn').onclick = () => awardBadge(selStudentId, document.getElementById('th-badge-id').value, "Нагорода від викладача");

        // Utils
        function showScreen(id) { document.querySelectorAll('.container > div').forEach(s => s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-st').onclick = () => signOut(auth);
        document.getElementById('logout-th').onclick = () => signOut(auth);
        document.getElementById('save-profile-btn').onclick = async () => {
            const r = document.getElementById('reg-role').value;
            await setDoc(doc(db, "Users", currentUid), {
                user_id: currentUid, full_name: auth.currentUser.displayName, email: auth.currentUser.email,
                role: r, sport_specialization: document.getElementById('reg-spec').value,
                group_id: r === 'student' ? document.getElementById('reg-group').value : "Teacher",
                total_xp: 0, created_at: serverTimestamp()
            });
        };
    </script>
</body>
</html>
