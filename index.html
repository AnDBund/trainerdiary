<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - Fixed</title>
    <style>
        :root { --primary: #4285f4; --bg: #f0f2f5; --white: #ffffff; }
        body { font-family: system-ui; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: var(--white); min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .p-4 { padding: 20px; }
        .hidden { display: none !important; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .tabs { display: flex; background: #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; cursor: pointer; }
        .tab-btn.active { background: white; border-bottom: 3px solid var(--primary); }
        .form-group { margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .history-item { background: #f9f9f9; padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--primary); font-size: 14px; }
        .user-header { background: var(--primary); color: white; padding: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Auth -->
        <div id="auth-screen" class="p-4">
            <h2>Вітаємо в Trainer Diary</h2>
            <button class="btn btn-primary" id="login-btn">Увійти через Google</button>
        </div>

        <!-- Registration -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Завершіть реєстрацію</h2>
            <div class="form-group">
                <label>Роль</label>
                <select id="reg-role">
                    <option value="student">Студент</option>
                    <option value="teacher">Викладач</option>
                </select>
            </div>
            <div class="form-group">
                <label>Спеціалізація</label>
                <input type="text" id="reg-spec" placeholder="Футбол">
            </div>
            <div class="form-group">
                <label>Група (тільки для студентів)</label>
                <input type="text" id="reg-group" placeholder="ФК-21">
            </div>
            <button class="btn btn-primary" id="save-profile-btn">Створити профіль</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-screen" class="hidden">
            <div class="user-header">
                <h3 id="user-name" style="margin:0">Користувач</h3>
                <div id="user-xp" style="font-weight:bold">0 XP</div>
                <button id="logout-btn" style="color:white; background:none; border:none; padding:0; cursor:pointer; font-size:12px">Вийти</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" id="btn-tab-sm">Самоконтроль</button>
                <button class="tab-btn" id="btn-tab-mt">Тести</button>
            </div>

            <div id="self-tab" class="p-4">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="sm-date">
                </div>
                <div class="form-group">
                    <label>RPE (1-10)</label>
                    <input type="range" id="sm-rpe" min="1" max="10">
                </div>
                <div class="form-group">
                    <label>Нотатки</label>
                    <textarea id="sm-notes"></textarea>
                </div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>
                <div id="sm-history" style="margin-top:20px"></div>
            </div>

            <div id="motor-tab" class="p-4 hidden">
                <div class="form-group">
                    <label>Тип тесту</label>
                    <select id="mt-type">
                        <option>Біг 30 м</option>
                        <option>Стрибок у довжину</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Результат</label>
                    <input type="number" id="mt-value" step="0.01">
                </div>
                <button class="btn btn-primary" id="save-mt-btn">Зафіксувати результат (+10 XP)</button>
                <div id="mt-history" style="margin-top:20px"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const screens = {
            auth: document.getElementById('auth-screen'),
            reg: document.getElementById('profile-form-screen'),
            dash: document.getElementById('dashboard-screen')
        };

        // --- AUTH LOGIC ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                if (userDoc.exists()) {
                    showScreen('dash');
                    initDashboard(user, userDoc.data());
                } else {
                    showScreen('reg');
                }
            } else {
                showScreen('auth');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider).catch(e => alert(e.message));
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // --- REGISTRATION ---
        document.getElementById('save-profile-btn').onclick = async () => {
            const user = auth.currentUser;
            const role = document.getElementById('reg-role').value; // Важливо: беремо значення в момент кліку
            
            const userData = {
                user_id: user.uid,
                full_name: user.displayName,
                email: user.email,
                role: role,
                sport_specialization: document.getElementById('reg-spec').value,
                group_id: document.getElementById('reg-group').value || "N/A",
                total_xp: 0,
                created_at: serverTimestamp()
            };

            try {
                await setDoc(doc(db, "Users", user.uid), userData);
                // Сторінка оновиться автоматично завдяки onAuthStateChanged
            } catch (e) {
                alert("Помилка реєстрації: " + e.message);
            }
        };

        // --- DASHBOARD LOGIC ---
        function initDashboard(user, data) {
            document.getElementById('user-name').innerText = data.full_name;
            document.getElementById('sm-date').valueAsDate = new Date();

            // Real-time XP update
            onSnapshot(doc(db, "Users", user.uid), (doc) => {
                if (doc.exists()) document.getElementById('user-xp').innerText = (doc.data().total_xp || 0) + " XP";
            });

            // History Listeners
            loadHistory(user.uid);
        }

        async function giveXP(uid) {
            // Використовуємо setDoc з merge, щоб поле точно створилося, якщо його нема
            await setDoc(doc(db, "Users", uid), { total_xp: increment(10) }, { merge: true });
        }

        // Save Self Monitoring
        document.getElementById('save-sm-btn').onclick = async () => {
            const user = auth.currentUser;
            try {
                await addDoc(collection(db, "Self_Monitoring"), {
                    user_id: user.uid,
                    entry_date: document.getElementById('sm-date').value,
                    rpe_score: document.getElementById('sm-rpe').value,
                    health_notes: document.getElementById('sm-notes').value,
                    created_at: serverTimestamp()
                });
                await giveXP(user.uid);
                alert("Збережено! +10 XP");
            } catch (e) {
                alert("Помилка: " + e.message);
            }
        };

        // Save Motor Tests
        document.getElementById('save-mt-btn').onclick = async () => {
            const user = auth.currentUser;
            try {
                await addDoc(collection(db, "Motor_Tests"), {
                    user_id: user.uid,
                    test_type: document.getElementById('mt-type').value,
                    test_value: document.getElementById('mt-value').value,
                    created_at: serverTimestamp()
                });
                await giveXP(user.uid);
                alert("Результат додано! +10 XP");
            } catch (e) {
                alert("Помилка: " + e.message);
            }
        };

        // --- UI HELPERS ---
        function showScreen(id) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[id].classList.remove('hidden');
        }

        function loadHistory(uid) {
            const qSm = query(collection(db, "Self_Monitoring"), where("user_id", "==", uid), orderBy("created_at", "desc"), limit(3));
            onSnapshot(qSm, (snap) => {
                document.getElementById('sm-history').innerHTML = '<h4>Історія</h4>' + snap.docs.map(d => `<div class="history-item">${d.data().entry_date}: RPE ${d.data().rpe_score}</div>`).join('');
            });
        }

        // Tab switching logic
        document.getElementById('btn-tab-sm').onclick = () => {
            document.getElementById('self-tab').classList.remove('hidden');
            document.getElementById('motor-tab').classList.add('hidden');
            document.getElementById('btn-tab-sm').classList.add('active');
            document.getElementById('btn-tab-mt').classList.remove('active');
        };
        document.getElementById('btn-tab-mt').onclick = () => {
            document.getElementById('self-tab').classList.add('hidden');
            document.getElementById('motor-tab').classList.remove('hidden');
            document.getElementById('btn-tab-mt').classList.add('active');
            document.getElementById('btn-tab-sm').classList.remove('active');
        };
    </script>
</body>
</html>
