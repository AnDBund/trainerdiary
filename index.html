<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - PWA</title>
    <style>
        :root {
            --primary: #4285f4;
            --primary-hover: #357ae8;
            --bg: #f0f2f5;
            --text: #333;
            --white: #ffffff;
            --accent: #34a853;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .hidden { display: none !important; }

        /* Auth & Profile Forms */
        .p-4 { padding: 1.5rem; }
        .text-center { text-align: center; }
        
        .btn {
            cursor: pointer;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-google { background: white; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* Tabs */
        .tabs {
            display: flex;
            background: #eee;
            border-bottom: 1px solid #ddd;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: #666;
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        /* Dashboard Header */
        .user-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 0 0 20px 20px;
        }

        .xp-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 5px;
        }

        /* Forms Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="range"] { padding: 0; }

        .range-value {
            text-align: center;
            font-weight: bold;
            color: var(--primary);
            display: block;
        }

        /* History Lists */
        .history-list {
            margin-top: 20px;
            border-top: 2px solid #f0f2f5;
            padding-top: 15px;
        }

        .history-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            border-left: 4px solid var(--primary);
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <!-- Екран логіну -->
        <div id="auth-screen" class="p-4 text-center">
            <h1 style="margin-top: 50px;">Trainer Diary</h1>
            <p>Система самоконтролю та моніторингу</p>
            <button class="btn btn-google" id="login-btn" style="margin-top: 30px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="">
                Увійти через Google
            </button>
        </div>

        <!-- Форма реєстрації (Перший вхід) -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Створення профілю</h2>
            <div class="form-group">
                <label>Ваша роль</label>
                <select id="reg-role">
                    <option value="student">Студент</option>
                    <option value="teacher">Викладач</option>
                </select>
            </div>
            <div class="form-group">
                <label>Спеціалізація</label>
                <input type="text" id="reg-spec" placeholder="Наприклад: Футбол">
            </div>
            <div class="form-group">
                <label>Спортивний розряд</label>
                <input type="text" id="reg-rank" placeholder="Наприклад: КМС">
            </div>
            <div id="reg-group-box" class="form-group">
                <label>Група</label>
                <input type="text" id="reg-group" placeholder="Наприклад: ФК-21">
            </div>
            <button class="btn btn-primary" id="save-profile-btn">Почати роботу</button>
        </div>

        <!-- Кабінет студента -->
        <div id="dashboard-screen" class="hidden">
            <div class="user-header">
                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div>
                        <h3 id="user-name" style="margin: 0;">Завантаження...</h3>
                        <div id="user-xp" class="xp-badge">0 XP</div>
                    </div>
                    <button id="logout-btn" style="background:none; border:none; color:white; cursor:pointer; opacity: 0.7;">Вийти</button>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="openTab('self-tab')">Самоконтроль</button>
                <button class="tab-btn" onclick="openTab('motor-tab')">Рухові тести</button>
            </div>

            <!-- Вкладка: Самоконтроль -->
            <div id="self-tab" class="tab-content p-4">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="sm-date">
                </div>
                <div class="form-group">
                    <label>RPE (Навантаження): <span id="rpe-val" class="range-value">5</span></label>
                    <input type="range" min="1" max="10" value="5" id="sm-rpe">
                    <small id="rpe-desc" style="display:block; text-align:center; color:#666;">Помірне навантаження</small>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:1">
                        <label>Втома (1-5)</label>
                        <select id="sm-fatigue"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Сон (1-5)</label>
                        <select id="sm-sleep"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Біль у м'язах (1-5)</label>
                    <select id="sm-muscle"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>
                </div>
                <div class="form-group">
                    <label>Нотатки</label>
                    <textarea id="sm-notes" rows="2" placeholder="Як ви почуваєтесь?"></textarea>
                </div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>

                <div class="history-list">
                    <h4>Останні записи</h4>
                    <div id="sm-history"></div>
                </div>
            </div>

            <!-- Вкладка: Тести -->
            <div id="motor-tab" class="tab-content hidden p-4">
                <div class="form-group">
                    <label>Тип тесту</label>
                    <select id="mt-type">
                        <option value="Біг 30 м">Біг 30 м</option>
                        <option value="Біг 1000 м">Біг 1000 м</option>
                        <option value="Стрибок у довжину">Стрибок у довжину з місця</option>
                        <option value="Підтягування">Підтягування</option>
                        <option value="Човниковий біг 4х9 м">Човниковий біг 4х9 м</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex:2">
                        <label>Результат</label>
                        <input type="number" step="0.01" id="mt-value" placeholder="0.00">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>Од. вим.</label>
                        <select id="mt-unit">
                            <option value="сек">сек</option>
                            <option value="м">м</option>
                            <option value="разів">разів</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Примітки</label>
                    <input type="text" id="mt-notes" placeholder="Умови проведення">
                </div>
                <button class="btn btn-primary" id="save-mt-btn" style="background: var(--accent);">Зафіксувати результат (+10 XP)</button>

                <div class="history-list">
                    <h4>Історія тестів</h4>
                    <div id="mt-history"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment, updateDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // --- ВСТАВ СВІЙ CONFIG ТУТ ---
        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // Елементи
        const screens = {
            auth: document.getElementById('auth-screen'),
            reg: document.getElementById('profile-form-screen'),
            dash: document.getElementById('dashboard-screen')
        };

        // Встановлення поточної дати за замовчуванням
        document.getElementById('sm-date').valueAsDate = new Date();

        // Логіка вкладок
        window.openTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        };

        // RPE Опис
        const rpeDescriptions = ["-", "Дуже легко", "Легко", "Помірно", "Досить легко", "Важко", "Важче", "Дуже важко", "Дуже-дуже важко", "Майже макс", "Максимум"];
        document.getElementById('sm-rpe').oninput = function() {
            document.getElementById('rpe-val').innerText = this.value;
            document.getElementById('rpe-desc').innerText = rpeDescriptions[this.value];
        };

        // Перевірка авторизації
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                if (userDoc.exists()) {
                    showScreen('dash');
                    setupDashboard(user, userDoc.data());
                } else {
                    showScreen('reg');
                }
            } else {
                showScreen('auth');
            }
        });

        // Вхід/Вихід
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Збереження профілю
        document.getElementById('save-profile-btn').onclick = async () => {
            const user = auth.currentUser;
            const data = {
                user_id: user.uid,
                full_name: user.displayName,
                email: user.email,
                auth_provider: "google.com",
                role: document.getElementById('reg-role').value,
                sport_specialization: document.getElementById('reg-spec').value,
                sport_rank: document.getElementById('reg-rank').value,
                group_id: document.getElementById('reg-group').value,
                total_xp: 0,
                created_at: serverTimestamp()
            };
            await setDoc(doc(db, "Users", user.uid), data);
        };

        function setupDashboard(user, userData) {
            document.getElementById('user-name').innerText = userData.full_name;
            document.getElementById('user-xp').innerText = `${userData.total_xp} XP`;

            // Слухач на зміну XP в реальному часі
            onSnapshot(doc(db, "Users", user.uid), (doc) => {
                if(doc.exists()) document.getElementById('user-xp').innerText = `${doc.data().total_xp} XP`;
            });

            // Завантаження історії Самоконтролю
            const qSm = query(collection(db, "Self_Monitoring"), where("user_id", "==", user.uid), orderBy("created_at", "desc"), limit(5));
            onSnapshot(qSm, (snap) => {
                const container = document.getElementById('sm-history');
                container.innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    return `<div class="history-item">
                        <b>${data.entry_date}</b> | RPE: ${data.rpe_score} | Втома: ${data.fatigue_level}/5<br>
                        <small>${data.health_notes || ''}</small>
                    </div>`;
                }).join('') || '<p>Записів ще немає</p>';
            });

            // Завантаження історії Тестів
            const qMt = query(collection(db, "Motor_Tests"), where("user_id", "==", user.uid), orderBy("created_at", "desc"), limit(10));
            onSnapshot(qMt, (snap) => {
                const container = document.getElementById('mt-history');
                container.innerHTML = snap.docs.map(d => {
                    const data = d.data();
                    return `<div class="history-item" style="border-left-color: var(--accent)">
                        <b>${data.test_type}</b>: ${data.test_value} ${data.measurement_unit}<br>
                        <small>${new Date(data.created_at?.toDate()).toLocaleDateString() || ''}</small>
                    </div>`;
                }).join('') || '<p>Результатів ще немає</p>';
            });
        }

        // Запис Самоконтролю
        document.getElementById('save-sm-btn').onclick = async () => {
            const user = auth.currentUser;
            const btn = document.getElementById('save-sm-btn');
            btn.disabled = true;

            const entry = {
                user_id: user.uid,
                entry_date: document.getElementById('sm-date').value,
                rpe_score: parseInt(document.getElementById('sm-rpe').value),
                fatigue_level: parseInt(document.getElementById('sm-fatigue').value),
                sleep_quality: parseInt(document.getElementById('sm-sleep').value),
                muscle_soreness: parseInt(document.getElementById('sm-muscle').value),
                health_notes: document.getElementById('sm-notes').value,
                created_at: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "Self_Monitoring"), entry);
                await updateDoc(doc(db, "Users", user.uid), { total_xp: increment(10) });
                document.getElementById('sm-notes').value = "";
                alert("Дані збережено! +10 XP");
            } catch(e) { console.error(e); }
            btn.disabled = false;
        };

        // Запис Тесту
        document.getElementById('save-mt-btn').onclick = async () => {
            const user = auth.currentUser;
            const val = document.getElementById('mt-value').value;
            if(!val) return alert("Введіть результат");

            const btn = document.getElementById('save-mt-btn');
            btn.disabled = true;

            const entry = {
                user_id: user.uid,
                test_type: document.getElementById('mt-type').value,
                test_value: parseFloat(val),
                measurement_unit: document.getElementById('mt-unit').value,
                notes: document.getElementById('mt-notes').value,
                created_at: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "Motor_Tests"), entry);
                await updateDoc(doc(db, "Users", user.uid), { total_xp: increment(10) });
                document.getElementById('mt-value').value = "";
                alert("Результат зафіксовано! +10 XP");
            } catch(e) { console.error(e); }
            btn.disabled = false;
        };

        function showScreen(id) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[id].classList.remove('hidden');
        }
    </script>
</body>
</html>
