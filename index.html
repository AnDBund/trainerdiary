<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trainer Diary - Multi-Role System</title>
    <style>
        :root { --primary: #4285f4; --accent: #34a853; --bg: #f0f2f5; --white: #ffffff; --warn: #fbbc05; --danger: #ea4335; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; background: var(--white); min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .p-4 { padding: 20px; }
        .hidden { display: none !important; }
        .btn { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-accent { background: var(--accent); color: white; }
        
        /* Header */
        .header { background: var(--primary); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .xp-badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; font-weight: bold; font-size: 14px; }

        /* Tabs & Lists */
        .tabs { display: flex; background: #f8f9fa; border-bottom: 1px solid #ddd; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: bold; color: #666; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: white; }

        /* Forms */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Teacher Dashboard Styles */
        .teacher-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }
        .student-card { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .student-card:hover { border-color: var(--primary); background: #f0f7ff; }
        .student-card.active { border-color: var(--primary); background: #e8f0fe; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f4f4f4; }

        .detail-view { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 20px; }
        .section-title { border-bottom: 2px solid var(--primary); margin-bottom: 15px; padding-bottom: 5px; color: var(--primary); font-size: 18px; }
        .history-mini { font-size: 12px; background: #f9f9f9; padding: 8px; border-radius: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Екран авторизації -->
        <div id="auth-screen" class="p-4" style="text-align: center; margin-top: 100px;">
            <h1>Trainer Diary</h1>
            <button class="btn btn-primary" id="login-btn" style="max-width: 300px;">Увійти через Google</button>
        </div>

        <!-- Екран реєстрації профілю -->
        <div id="profile-form-screen" class="hidden p-4">
            <h2>Створення профілю</h2>
            <div class="form-group"><label>Роль</label><select id="reg-role"><option value="student">Студент</option><option value="teacher">Викладач</option></select></div>
            <div class="form-group"><label>Спеціалізація</label><input type="text" id="reg-spec" placeholder="Футбол"></div>
            <div id="group-reg-box" class="form-group"><label>Група</label><input type="text" id="reg-group" placeholder="ФК-21"></div>
            <button class="btn btn-primary" id="save-profile-btn">Зберегти та увійти</button>
        </div>

        <!-- КАБІНЕТ СТУДЕНТА -->
        <div id="student-dashboard" class="hidden">
            <div class="header">
                <div><h2 id="st-name" style="margin:0">Студент</h2><span id="st-group" style="font-size: 12px; opacity: 0.8;"></span></div>
                <div style="text-align: right;"><div id="st-xp" class="xp-badge">0 XP</div><br><button id="logout-st" style="color:white; background:none; border:none; cursor:pointer; font-size:11px;">Вийти</button></div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('sm')">Самоконтроль</button>
                <button class="tab-btn" onclick="switchTab('mt')">Тести</button>
            </div>
            <div id="sm-tab" class="p-4">
                <div class="form-group"><label>Дата</label><input type="date" id="sm-date"></div>
                <div class="form-group"><label>RPE (1-10): <span id="rpe-val">5</span></label><input type="range" id="sm-rpe" min="1" max="10"></div>
                <div style="display:flex; gap:10px">
                    <div class="form-group" style="flex:1"><label>Втома (1-5)</label><select id="sm-fatigue"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                    <div class="form-group" style="flex:1"><label>Сон (1-5)</label><select id="sm-sleep"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
                </div>
                <button class="btn btn-primary" id="save-sm-btn">Зберегти стан (+10 XP)</button>
                <div id="sm-history" style="margin-top:20px"></div>
            </div>
            <div id="mt-tab" class="hidden p-4">
                <div class="form-group"><label>Тип тесту</label><select id="mt-type"><option>Біг 30 м</option><option>Стрибок у довжину</option><option>Підтягування</option></select></div>
                <div class="form-group"><label>Результат</label><input type="number" id="mt-value" step="0.01"></div>
                <button class="btn btn-primary" id="save-mt-btn" style="background:var(--accent)">Зафіксувати результат (+10 XP)</button>
                <div id="mt-history" style="margin-top:20px"></div>
            </div>
        </div>

        <!-- ПАНЕЛЬ ВИКЛАДАЧА -->
        <div id="teacher-dashboard" class="hidden">
            <div class="header">
                <div><h2 id="th-name" style="margin:0">Панель викладача</h2><span>Моніторинг та оцінювання</span></div>
                <button id="logout-th" style="color:white; background:none; border:none; cursor:pointer;">Вийти</button>
            </div>
            
            <div class="teacher-grid">
                <!-- Ліва колонка: Список студентів -->
                <div class="sidebar">
                    <div class="form-group">
                        <label>Оберіть групу</label>
                        <select id="th-group-filter"><option value="">Всі групи</option></select>
                    </div>
                    <div id="student-list-container">
                        <!-- Список студентів буде тут -->
                    </div>
                </div>

                <!-- Права колонка: Деталі та дії -->
                <div id="student-details" class="detail-view hidden">
                    <div id="details-header" class="section-title">Оберіть студента</div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" id="btn-view-stats">Статистика</button>
                        <button class="tab-btn" id="btn-view-grade">Оцінити / Нагородити</button>
                    </div>

                    <!-- Перегляд даних студента -->
                    <div id="view-stats-box" class="p-4">
                        <h4>Самоконтроль (Останні записи)</h4>
                        <div id="th-sm-view"></div>
                        <h4>Результати тестів</h4>
                        <div id="th-mt-view"></div>
                    </div>

                    <!-- Форми оцінювання та значків -->
                    <div id="view-grade-box" class="p-4 hidden">
                        <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                            <h4 style="margin-top:0">Виставити оцінку</h4>
                            <div class="form-group"><input type="number" id="grade-val" placeholder="Бали (напр. 95)"></div>
                            <div class="form-group">
                                <select id="grade-type">
                                    <option value="Поточний">Поточний контроль</option>
                                    <option value="Модульний">Модульний контроль</option>
                                    <option value="Семестровий">Семестровий контроль</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" id="btn-save-grade">Зберегти оцінку</button>
                        </div>

                        <div style="background: #e1f5fe; padding: 15px; border-radius: 8px;">
                            <h4 style="margin-top:0">Нагородити значком</h4>
                            <div class="form-group">
                                <select id="badge-select">
                                    <option value="Тренер (за оригінальність)">Значок «Тренер» (+50 XP)</option>
                                    <option value="Фахівець (за роботу з IoT)">Значок «Фахівець» (+50 XP)</option>
                                    <option value="Експерт AI">Значок «Експерт AI» (+50 XP)</option>
                                </select>
                            </div>
                            <div class="form-group"><textarea id="badge-comment" placeholder="Коментар викладача..."></textarea></div>
                            <button class="btn btn-accent" id="btn-award-badge" style="width:100%">Присвоїти значок (+50 XP)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, collection, query, where, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // КОНФІГУРАЦІЯ
        const firebaseConfig = {
            apiKey: "AIzaSyDbrnCtj-D-KG_yxcNn5t_NcnokGzDMtzE",
            authDomain: "trainerdiary-4245e.firebaseapp.com",
            projectId: "trainerdiary-4245e",
            storageBucket: "trainerdiary-4245e.firebasestorage.app",
            messagingSenderId: "939887849237",
            appId: "1:939887849237:web:630cee43cb1708188bc31c",
            measurementId: "G-S02E3G6ZB4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentSelectedStudentId = null;

        // РОУТИНГ ПРИ АВТОРИЗАЦІЇ
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "Users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (userData.role === 'teacher') {
                        showScreen('teacher-dashboard');
                        initTeacherDashboard(user, userData);
                    } else {
                        showScreen('student-dashboard');
                        initStudentDashboard(user, userData);
                    }
                } else {
                    showScreen('profile-form-screen');
                }
            } else {
                showScreen('auth-screen');
            }
        });

        // --- ЛОГІКА СТУДЕНТА ---
        function initStudentDashboard(user, data) {
            document.getElementById('st-name').innerText = data.full_name;
            document.getElementById('st-group').innerText = data.group_id;
            document.getElementById('sm-date').valueAsDate = new Date();
            onSnapshot(doc(db, "Users", user.uid), (d) => {
                if(d.exists()) document.getElementById('st-xp').innerText = d.data().total_xp + " XP";
            });
            loadStudentHistory(user.uid);
        }

        async function loadStudentHistory(uid) {
            const q = query(collection(db, "Self_Monitoring"), where("user_id", "==", uid), orderBy("created_at", "desc"), limit(3));
            onSnapshot(q, (s) => {
                document.getElementById('sm-history').innerHTML = '<h4>Історія</h4>' + s.docs.map(d => `<div class="history-mini">${d.data().entry_date}: RPE ${d.data().rpe_score}</div>`).join('');
            });
        }

        // --- ЛОГІКА ВИКЛАДАЧА ---
        async function initTeacherDashboard(user, userData) {
            document.getElementById('th-name').innerText = userData.full_name;
            
            // 1. Отримати всіх студентів для фільтра груп
            const q = query(collection(db, "Users"), where("role", "==", "student"));
            const querySnapshot = await getDocs(q);
            const students = [];
            const groups = new Set();
            
            querySnapshot.forEach(doc => {
                const data = doc.data();
                students.push({ id: doc.id, ...data });
                if(data.group_id) groups.add(data.group_id);
            });

            // Заповнити селектор груп
            const groupSelect = document.getElementById('th-group-filter');
            groupSelect.innerHTML = '<option value="">Всі студенти</option>';
            groups.forEach(g => groupSelect.innerHTML += `<option value="${g}">${g}</option>`);

            renderStudentList(students);

            groupSelect.onchange = () => {
                const filtered = groupSelect.value ? students.filter(s => s.group_id === groupSelect.value) : students;
                renderStudentList(filtered);
            };
        }

        function renderStudentList(list) {
            const container = document.getElementById('student-list-container');
            container.innerHTML = list.map(s => `
                <div class="student-card" onclick="selectStudent('${s.id}', '${s.full_name}')">
                    <strong>${s.full_name}</strong><br>
                    <small>${s.group_id} | ${s.sport_specialization} | ${s.total_xp} XP</small>
                </div>
            `).join('');
        }

        window.selectStudent = async (id, name) => {
            currentSelectedStudentId = id;
            document.querySelectorAll('.student-card').forEach(c => c.classList.remove('active'));
            document.getElementById('student-details').classList.remove('hidden');
            document.getElementById('details-header').innerText = name;
            
            // Завантаження даних студента для викладача
            const smQ = query(collection(db, "Self_Monitoring"), where("user_id", "==", id), orderBy("created_at", "desc"), limit(5));
            const mtQ = query(collection(db, "Motor_Tests"), where("user_id", "==", id), orderBy("created_at", "desc"), limit(5));
            
            const [smS, mtS] = await Promise.all([getDocs(smQ), getDocs(mtQ)]);
            
            document.getElementById('th-sm-view').innerHTML = smS.docs.map(d => `<div class="history-mini">${d.data().entry_date}: RPE ${d.data().rpe_score}, Втома ${d.data().fatigue_level}</div>`).join('') || "Немає записів";
            document.getElementById('th-mt-view').innerHTML = mtS.docs.map(d => `<div class="history-mini">${d.data().test_type}: ${d.data().test_value} ${d.data().measurement_unit}</div>`).join('') || "Немає тестів";
        };

        // Дії викладача: Оцінка
        document.getElementById('btn-save-grade').onclick = async () => {
            if(!currentSelectedStudentId) return;
            const val = document.getElementById('grade-val').value;
            if(!val) return alert("Введіть бал");
            
            await addDoc(collection(db, "Grades"), {
                user_id: currentSelectedStudentId,
                teacher_id: auth.currentUser.uid,
                grade_value: parseInt(val),
                control_type: document.getElementById('grade-type').value,
                graded_at: serverTimestamp()
            });
            alert("Оцінку виставлено!");
            document.getElementById('grade-val').value = "";
        };

        // Дії викладача: Значок
        document.getElementById('btn-award-badge').onclick = async () => {
            if(!currentSelectedStudentId) return;
            const badge = document.getElementById('badge-select').value;
            
            await addDoc(collection(db, "User_Badges"), {
                user_id: currentSelectedStudentId,
                badge_id: badge,
                awarded_by: auth.currentUser.uid,
                reason_or_comment: document.getElementById('badge-comment').value,
                awarded_at: serverTimestamp()
            });

            // Нарахування +50 XP студенту
            await setDoc(doc(db, "Users", currentSelectedStudentId), { total_xp: increment(50) }, { merge: true });
            
            alert("Значок присвоєно! Студент отримав +50 XP");
            document.getElementById('badge-comment').value = "";
        };

        // --- ДОПОМІЖНІ ФУНКЦІЇ ---
        function showScreen(id) {
            ['auth-screen', 'profile-form-screen', 'student-dashboard', 'teacher-dashboard'].forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
        }

        window.switchTab = (type) => {
            document.getElementById('sm-tab').classList.toggle('hidden', type !== 'sm');
            document.getElementById('mt-tab').classList.toggle('hidden', type !== 'mt');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(type)));
        };

        // Перемикачі в деталях студента (викладач)
        document.getElementById('btn-view-stats').onclick = () => {
            document.getElementById('view-stats-box').classList.remove('hidden');
            document.getElementById('view-grade-box').classList.add('hidden');
            document.getElementById('btn-view-stats').classList.add('active');
            document.getElementById('btn-view-grade').classList.remove('active');
        };
        document.getElementById('btn-view-grade').onclick = () => {
            document.getElementById('view-stats-box').classList.add('hidden');
            document.getElementById('view-grade-box').classList.remove('hidden');
            document.getElementById('btn-view-grade').classList.add('active');
            document.getElementById('btn-view-stats').classList.remove('active');
        };

        // Логіка входу та збереження (студент)
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);
        document.getElementById('logout-st').onclick = () => signOut(auth);
        document.getElementById('logout-th').onclick = () => signOut(auth);

        document.getElementById('save-profile-btn').onclick = async () => {
            const user = auth.currentUser;
            const role = document.getElementById('reg-role').value;
            await setDoc(doc(db, "Users", user.uid), {
                user_id: user.uid,
                full_name: user.displayName,
                email: user.email,
                role: role,
                sport_specialization: document.getElementById('reg-spec').value,
                group_id: role === 'student' ? document.getElementById('reg-group').value : "Викладачі",
                total_xp: 0,
                created_at: serverTimestamp()
            });
        };

        // Збереження даних (Студент)
        document.getElementById('save-sm-btn').onclick = async () => {
            const user = auth.currentUser;
            await addDoc(collection(db, "Self_Monitoring"), {
                user_id: user.uid,
                entry_date: document.getElementById('sm-date').value,
                rpe_score: parseInt(document.getElementById('sm-rpe').value),
                fatigue_level: parseInt(document.getElementById('sm-fatigue').value),
                sleep_quality: parseInt(document.getElementById('sm-sleep').value),
                created_at: serverTimestamp()
            });
            await setDoc(doc(db, "Users", user.uid), { total_xp: increment(10) }, { merge: true });
            alert("Дані збережено! +10 XP");
        };

        document.getElementById('save-mt-btn').onclick = async () => {
            const user = auth.currentUser;
            await addDoc(collection(db, "Motor_Tests"), {
                user_id: user.uid,
                test_type: document.getElementById('mt-type').value,
                test_value: parseFloat(document.getElementById('mt-value').value),
                measurement_unit: "одиниць",
                created_at: serverTimestamp()
            });
            await setDoc(doc(db, "Users", user.uid), { total_xp: increment(10) }, { merge: true });
            alert("Тест збережено! +10 XP");
        };

    </script>
</body>
</html>
